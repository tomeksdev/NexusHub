version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - backend

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    labels:
      - dependencies
      - cli

  - package-ecosystem: gomod
    directory: /ebpf
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ebpf

  # npm (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    groups:
      # react + react-dom must move in lockstep — a split bump
      # produces a runtime version mismatch and crashes the SPA
      # at startup with React error #527 (see #95). Group their
      # type packages too so the whole React surface lands as a
      # single PR.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # Docker base images
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
