name: Release artifacts

# GoReleaser cuts the release archives (.tar.gz, .deb, .rpm,
# checksums.txt) and uploads them to the GitHub Release for the
# pushed tag. Two archive sets are produced from one goreleaser
# run:
#
#   nexushub_<ver>_<os>_<arch>.tar.gz         — operator-side CLI
#                                               (linux + darwin,
#                                                amd64 + arm64)
#   nexushub-api_<ver>_linux_<arch>.tar.gz    — API server stack
#                                               (api + migrate +
#                                                seed binaries +
#                                                systemd unit +
#                                                env template +
#                                                SQL migrations)
#
# The bare-metal installer in scripts/install.sh downloads the
# nexushub-api archive on every install. Multi-arch container
# images are handled separately by docker-publish.yml on the
# same tag trigger; release-please owns CHANGELOG.md and creates
# the GitHub Release entry when its release PR merges to main.
#
# Order of operations on a tag push:
#   1. release-please-action (release.yml) merges the release PR
#      and creates the GitHub Release at the tag.
#   2. This workflow runs goreleaser to attach the archives.
#   3. docker-publish.yml builds and pushes the container image.
#
# All three are independent jobs keyed on the same tag, so order
# is eventual rather than strict.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required by goreleaser to compute
          # snapshot version + commit metadata in archives.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # Cache every module's go.sum so the per-module
          # `go mod tidy` hooks in .goreleaser.yaml don't redownload
          # on every run.
          cache-dependency-path: |
            cli/go.sum
            backend/go.sum
            ebpf/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
