name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tomeksdev/nexushub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag matrix:
          # - `2.0.0-preview.X` — `{{version}}` strips the leading `v`,
          #   conventional Docker form.
          # - `v2.0.0-preview.X` — `{{raw}}` keeps the leading `v` so
          #   `NEXUSHUB_VERSION=v2.0.0-preview.X` matches both the
          #   bare-metal installer's tag and the Docker image without
          #   the operator remembering which form to use.
          # - `{{major}}.{{minor}}` + `{{major}}` only emit for clean
          #   semver tags; the `enable=` line below disables them for
          #   pre-releases so we don't accidentally publish
          #   `2.0` from `v2.0.0-preview.3`.
          # - `latest` is also gated off pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
